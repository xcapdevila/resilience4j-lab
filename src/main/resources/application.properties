spring.application.name=resilience4j-lab

server.port=8080
server.servlet.context-path=/demo

spring.jackson.serialization.indent-output=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=100
resilience4j.circuitbreaker.configs.default.maxWaitDurationInHalfOpenState=0

# The default configuration keeps the normal Resilience4j HALF_OPEN behavior.
# Only the original /process endpoint opts in to gradual recovery.
# The admission percentage controls traffic reaching the backend during recovery.
# It is independent of the /process/{successRatio} backend-success simulation.
# Omitted initialTrafficPercentage uses the step as the first admitted percentage.
resilience4j.circuitbreaker.instances[DemoService.process].halfOpenRecovery.enabled=true
resilience4j.circuitbreaker.instances[DemoService.process].halfOpenRecovery.trafficPercentageStep=5
resilience4j.circuitbreaker.instances[DemoService.process].halfOpenRecovery.minimumPhaseDuration=1s
resilience4j.circuitbreaker.instances[DemoService.process].halfOpenRecovery.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances[DemoService.process].halfOpenRecovery.failureStrategy=STEP_BACK
# Recovery has independent health bands; normal CLOSED and finite HALF_OPEN retain the default thresholds.
resilience4j.circuitbreaker.instances[DemoService.process].halfOpenRecovery.maxFailureRateForAdvance=5
resilience4j.circuitbreaker.instances[DemoService.process].halfOpenRecovery.failureRateThreshold=20
resilience4j.circuitbreaker.instances[DemoService.process].halfOpenRecovery.maxSlowCallRateForAdvance=10
resilience4j.circuitbreaker.instances[DemoService.process].halfOpenRecovery.slowCallRateThreshold=50

# /process-standard demonstrates the normal finite-probe HALF_OPEN policy.
resilience4j.circuitbreaker.instances[DemoService.processStandard].permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances[DemoService.processStandard].minimumNumberOfCalls=3
